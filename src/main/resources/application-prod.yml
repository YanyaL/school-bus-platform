spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

springdoc:
  swagger-ui:
    enabled: false

school-bus:
  trip-list-cache:
    ttl: ${TRIP_LIST_CACHE_TTL:PT1M}
  trip-status:
    scheduler:
      enabled: ${TRIP_STATUS_SCHEDULER_ENABLED:true}
      initial-delay-ms: ${TRIP_STATUS_SCHEDULER_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${TRIP_STATUS_SCHEDULER_FIXED_DELAY_MS:30000}
  security:
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}

logging:
  level:
    root: INFO
    com.schoolbus: INFO
