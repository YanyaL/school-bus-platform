spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3s}
    requested-heartbeat: ${RABBITMQ_REQUESTED_HEARTBEAT:30s}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

springdoc:
  swagger-ui:
    enabled: false

school-bus:
  booking:
    expiration:
      scheduler:
        enabled: ${BOOKING_EXPIRATION_SCHEDULER_ENABLED:true}
        initial-delay-ms: ${BOOKING_EXPIRATION_INITIAL_DELAY_MS:15000}
        fixed-delay-ms: ${BOOKING_EXPIRATION_FIXED_DELAY_MS:10000}
  trip-list-cache:
    ttl: ${TRIP_LIST_CACHE_TTL:PT1M}
  trip-status:
    scheduler:
      enabled: ${TRIP_STATUS_SCHEDULER_ENABLED:true}
      initial-delay-ms: ${TRIP_STATUS_SCHEDULER_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${TRIP_STATUS_SCHEDULER_FIXED_DELAY_MS:30000}
  security:
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
  payment:
    callback-secret: ${PAYMENT_CALLBACK_SECRET}

logging:
  level:
    root: INFO
    com.schoolbus: INFO
