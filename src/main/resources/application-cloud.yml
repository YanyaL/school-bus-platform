spring:
  application:
    name: school-bus-core
  cloud:
    nacos:
      config:
        enabled: true
      discovery:
        enabled: true

server:
  port: ${CORE_SERVER_PORT:8081}

# When splitting JWT verification across services, point both core and
# transport-query at the same local-dev key pair (gitignored under cloud/dev-keys).
school-bus:
  security:
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}

info:
  cloud:
    role: core-service
    registry: nacos
