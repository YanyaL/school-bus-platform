spring:
  application:
    name: school-bus-core
  cloud:
    nacos:
      config:
        enabled: true
      discovery:
        enabled: true

server:
  port: ${CORE_SERVER_PORT:8081}

# Cloud Core verifies JWTs with the public key only. Signing and auth HTTP
# endpoints live in school-bus-iam (see school-bus.iam.embedded.enabled).
school-bus:
  payment:
    embedded:
      enabled: false
    refund-messaging:
      embedded: false
  iam:
    embedded:
      enabled: false
  booking:
    embedded:
      enabled: false
  transport:
    admin:
      embedded:
        enabled: false
  security:
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}

info:
  cloud:
    role: core-service
    registry: nacos
