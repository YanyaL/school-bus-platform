spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3s}
    requested-heartbeat: ${RABBITMQ_REQUESTED_HEARTBEAT:30s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/school_bus_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

logging:
  level:
    root: INFO
    com.schoolbus: DEBUG
    org.mybatis: INFO

school-bus:
  booking:
    expiration:
      scheduler:
        enabled: ${BOOKING_EXPIRATION_SCHEDULER_ENABLED:true}
        initial-delay-ms: ${BOOKING_EXPIRATION_INITIAL_DELAY_MS:15000}
        fixed-delay-ms: ${BOOKING_EXPIRATION_FIXED_DELAY_MS:10000}
  trip-list-cache:
    ttl: ${TRIP_LIST_CACHE_TTL:PT1M}
  trip-status:
    scheduler:
      enabled: ${TRIP_STATUS_SCHEDULER_ENABLED:true}
      initial-delay-ms: ${TRIP_STATUS_SCHEDULER_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${TRIP_STATUS_SCHEDULER_FIXED_DELAY_MS:30000}
