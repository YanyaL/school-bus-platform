spring:
  application:
    name: school-bus-platform
  config:
    import:
      - optional:nacos:${NACOS_CONFIG_DATA_ID:school-bus-core.yml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        health-indicator:
          enabled: ${NACOS_HEALTH_INDICATOR_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        health-indicator:
          enabled: ${NACOS_HEALTH_INDICATOR_ENABLED:false}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_LISTENER_PREFETCH:20}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Campus school bus booking platform
    java-version: ${java.version}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


school-bus:
  iam:
    embedded:
      # Local modular monolith keeps register/login/signing in-process.
      # Cloud profile sets this to false; school-bus-iam owns those routes.
      enabled: true
  rate-limit:
    enabled: ${SENTINEL_RATE_LIMIT_ENABLED:false}
    login-qps: ${SENTINEL_LOGIN_QPS:10}
    create-booking-qps: ${SENTINEL_CREATE_BOOKING_QPS:30}
    payment-callback-qps: ${SENTINEL_PAYMENT_CALLBACK_QPS:100}
  booking:
    payment-window: ${BOOKING_PAYMENT_WINDOW:PT15M}
    maximum-attempts: ${BOOKING_MAXIMUM_ATTEMPTS:3}
    expiration:
      batch-size: ${BOOKING_EXPIRATION_BATCH_SIZE:100}
  transport:
    publication-events:
      # Shadow event source only; existing synchronous seat/inventory initialization remains authoritative.
      enabled: ${TRIP_PUBLICATION_EVENTS_ENABLED:false}
      relay-enabled: ${TRIP_PUBLICATION_RELAY_ENABLED:false}
    trip-cancellation:
      reconciliation:
        enabled: ${TRIP_CANCELLATION_RECONCILIATION_ENABLED:false}
        grace-period: ${TRIP_CANCELLATION_RECONCILIATION_GRACE_PERIOD:PT2M}
        batch-size: ${TRIP_CANCELLATION_RECONCILIATION_BATCH_SIZE:100}
        initial-delay-ms: ${TRIP_CANCELLATION_RECONCILIATION_INITIAL_DELAY_MS:30000}
        fixed-delay-ms: ${TRIP_CANCELLATION_RECONCILIATION_FIXED_DELAY_MS:30000}
  identity:
    worker-id: ${SCHOOL_BUS_WORKER_ID:0}
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://school-bus.local}
      audience: ${JWT_AUDIENCE:school-bus-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:PT168H}
  payment:
    embedded:
      # Local modular monolith keeps payment callback handling in-process.
      # Cloud profile disables it after Gateway routes callbacks to Payment.
      enabled: true
    refund-messaging:
      # Local monolith keeps refund Outbox relay and Rabbit consumer in Core.
      embedded: true
    callback-secret: ${PAYMENT_CALLBACK_SECRET:local-payment-secret-change-me-1234}
  messaging:
    outbox-relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      claim-timeout: ${OUTBOX_RELAY_CLAIM_TIMEOUT:PT30S}
      confirm-timeout: ${OUTBOX_RELAY_CONFIRM_TIMEOUT:PT5S}
      initial-retry-delay: ${OUTBOX_RELAY_INITIAL_RETRY_DELAY:PT5S}
      maximum-retry-delay: ${OUTBOX_RELAY_MAXIMUM_RETRY_DELAY:PT5M}
      maximum-attempts: ${OUTBOX_RELAY_MAXIMUM_ATTEMPTS:10}
      initial-delay-ms: ${OUTBOX_RELAY_INITIAL_DELAY_MS:5000}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
    payment:
      exchange: ${PAYMENT_EVENTS_EXCHANGE:schoolbus.payment.events}
      refund-routing-key: ${PAYMENT_REFUND_ROUTING_KEY:payment.refund.required}
      refund-queue: ${PAYMENT_REFUND_QUEUE:schoolbus.payment.refund}
      dead-letter-exchange: ${PAYMENT_DLX:schoolbus.payment.dlx}
      dead-letter-routing-key: ${PAYMENT_REFUND_DEAD_ROUTING_KEY:payment.refund.dead}
      dead-letter-queue: ${PAYMENT_REFUND_DLQ:schoolbus.payment.refund.dlq}
      succeeded-routing-key: ${PAYMENT_SUCCEEDED_ROUTING_KEY:payment.succeeded}
      succeeded-queue: ${PAYMENT_SUCCEEDED_QUEUE:schoolbus.booking.payment-succeeded}
      succeeded-dead-letter-routing-key: ${PAYMENT_SUCCEEDED_DEAD_ROUTING_KEY:payment.succeeded.dead}
      succeeded-dead-letter-queue: ${PAYMENT_SUCCEEDED_DLQ:schoolbus.booking.payment-succeeded.dlq}
    payment-refund-retry:
      exchange: ${PAYMENT_REFUND_RETRY_EXCHANGE:schoolbus.payment.retry}
      routing-key: ${PAYMENT_REFUND_RETRY_ROUTING_KEY:payment.refund.retry}
      queue: ${PAYMENT_REFUND_RETRY_QUEUE:schoolbus.payment.refund.retry}
      delay: ${PAYMENT_REFUND_RETRY_DELAY:PT30S}
      maximum-retries: ${PAYMENT_REFUND_MAXIMUM_RETRIES:3}
      confirm-timeout: ${PAYMENT_REFUND_RETRY_CONFIRM_TIMEOUT:PT5S}
    payment-succeeded-retry:
      exchange: ${PAYMENT_SUCCEEDED_RETRY_EXCHANGE:schoolbus.booking.retry}
      routing-key: ${PAYMENT_SUCCEEDED_RETRY_ROUTING_KEY:payment.succeeded.retry}
      queue: ${PAYMENT_SUCCEEDED_RETRY_QUEUE:schoolbus.booking.payment-succeeded.retry}
      delay: ${PAYMENT_SUCCEEDED_RETRY_DELAY:PT30S}
      maximum-retries: ${PAYMENT_SUCCEEDED_MAXIMUM_RETRIES:3}
      confirm-timeout: ${PAYMENT_SUCCEEDED_RETRY_CONFIRM_TIMEOUT:PT5S}
    booking-expiration:
      delay-exchange: ${BOOKING_EXPIRATION_DELAY_EXCHANGE:schoolbus.booking.expiration.delay}
      delay-routing-key: ${BOOKING_EXPIRATION_DELAY_ROUTING_KEY:booking.payment.deadline.delay}
      delay-queue: ${BOOKING_EXPIRATION_DELAY_QUEUE:schoolbus.booking.expiration.delay}
      processing-exchange: ${BOOKING_EXPIRATION_PROCESSING_EXCHANGE:schoolbus.booking.events}
      processing-routing-key: ${BOOKING_EXPIRATION_PROCESSING_ROUTING_KEY:booking.payment.deadline.reached}
      processing-queue: ${BOOKING_EXPIRATION_PROCESSING_QUEUE:schoolbus.booking.expiration}
      dead-letter-exchange: ${BOOKING_EXPIRATION_DLX:schoolbus.booking.dlx}
      dead-letter-routing-key: ${BOOKING_EXPIRATION_DEAD_ROUTING_KEY:booking.expiration.dead}
      dead-letter-queue: ${BOOKING_EXPIRATION_DLQ:schoolbus.booking.expiration.dlq}
    trip-cancellation:
      exchange: ${TRIP_CANCELLATION_EXCHANGE:schoolbus.transport.events}
      requested-routing-key: ${TRIP_CANCELLATION_REQUESTED_ROUTING_KEY:trip.cancellation.requested}
      requested-queue: ${TRIP_CANCELLATION_REQUESTED_QUEUE:schoolbus.booking.trip-cancellation}
      settled-routing-key: ${TRIP_CANCELLATION_SETTLED_ROUTING_KEY:trip.cancellation.settled}
      settled-queue: ${TRIP_CANCELLATION_SETTLED_QUEUE:schoolbus.transport.trip-cancellation-settled}
      dead-letter-exchange: ${TRIP_CANCELLATION_DLX:schoolbus.transport.dlx}
      dead-letter-routing-key: ${TRIP_CANCELLATION_DEAD_ROUTING_KEY:trip.cancellation.dead}
      dead-letter-queue: ${TRIP_CANCELLATION_DLQ:schoolbus.transport.trip-cancellation.dlq}
    trip-cancellation-retry:
      exchange: ${TRIP_CANCELLATION_RETRY_EXCHANGE:schoolbus.transport.cancellation.retry}
      requested-routing-key: ${TRIP_CANCELLATION_REQUESTED_RETRY_ROUTING_KEY:trip.cancellation.requested.retry}
      requested-queue: ${TRIP_CANCELLATION_REQUESTED_RETRY_QUEUE:schoolbus.booking.trip-cancellation.retry}
      settled-routing-key: ${TRIP_CANCELLATION_SETTLED_RETRY_ROUTING_KEY:trip.cancellation.settled.retry}
      settled-queue: ${TRIP_CANCELLATION_SETTLED_RETRY_QUEUE:schoolbus.transport.trip-cancellation-settled.retry}
      delay: ${TRIP_CANCELLATION_RETRY_DELAY:PT30S}
      maximum-retries: ${TRIP_CANCELLATION_MAXIMUM_RETRIES:3}
      confirm-timeout: ${TRIP_CANCELLATION_RETRY_CONFIRM_TIMEOUT:PT5S}
