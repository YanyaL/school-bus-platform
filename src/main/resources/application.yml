spring:
  application:
    name: school-bus-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Campus school bus booking platform
    java-version: ${java.version}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


school-bus:
  identity:
    worker-id: ${SCHOOL_BUS_WORKER_ID:0}
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://school-bus.local}
      audience: ${JWT_AUDIENCE:school-bus-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
