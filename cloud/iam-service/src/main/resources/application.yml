spring:
  application:
    name: school-bus-iam
  config:
    import:
      - optional:nacos:${NACOS_CONFIG_DATA_ID:school-bus-iam.yml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        health-indicator:
          enabled: ${NACOS_HEALTH_INDICATOR_ENABLED:true}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        health-indicator:
          enabled: ${NACOS_HEALTH_INDICATOR_ENABLED:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/school_bus_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  flyway:
    enabled: false

server:
  port: ${IAM_SERVER_PORT:8084}
  shutdown: graceful

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

school-bus:
  identity:
    worker-id: ${SCHOOL_BUS_WORKER_ID:0}
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://school-bus.local}
      audience: ${JWT_AUDIENCE:school-bus-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:PT168H}
    sso:
      allowed-origins:
        - ${SSO_STUDENT_ORIGIN:http://127.0.0.1:5173}
      student:
        client-id: ${SSO_STUDENT_CLIENT_ID:school-bus-student-web}
        redirect-uri: ${SSO_STUDENT_REDIRECT_URI:http://127.0.0.1:5173/auth/callback}
        post-logout-redirect-uri: ${SSO_STUDENT_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:5173/login}
      admin:
        client-id: ${SSO_ADMIN_CLIENT_ID:school-bus-admin-web}
        redirect-uri: ${SSO_ADMIN_REDIRECT_URI:http://127.0.0.1:5174/auth/callback}
        post-logout-redirect-uri: ${SSO_ADMIN_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:5174/login}

info:
  app:
    name: ${spring.application.name}
    role: iam-service
  cloud:
    registry: nacos
  database:
    ownership: shared-mysql-transition
    note: IAM owns account writes; local may reuse the same MySQL as Core during strangler cutover.
