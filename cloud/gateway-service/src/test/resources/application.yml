spring:
  config:
    import:
      - optional:nacos:school-bus-gateway-test.yml
  cloud:
    nacos:
      config:
        enabled: false
        health-indicator:
          enabled: false
      discovery:
        enabled: false
        health-indicator:
          enabled: false

management:
  health:
    nacos-config:
      enabled: false
    nacos-discovery:
      enabled: false

school-bus:
  security:
    jwt:
      issuer: https://school-bus.local
      audience: school-bus-api
      public-key-location: ""
  gateway:
    token-revocation:
      enabled: false
      fail-closed: true
      key-prefix: "schoolbus:auth:revoked-before:"
    transport-query-resilience:
      enabled: true
      retries: 1
      connect-timeout: 500ms
      response-timeout: 2s
      first-backoff: 50ms
      max-backoff: 200ms
