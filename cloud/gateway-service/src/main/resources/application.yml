spring:
  application:
    name: school-bus-gateway
  config:
    import:
      - optional:nacos:${NACOS_CONFIG_DATA_ID:school-bus-gateway.yml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        health-indicator:
          enabled: ${NACOS_HEALTH_INDICATOR_ENABLED:true}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        health-indicator:
          enabled: ${NACOS_HEALTH_INDICATOR_ENABLED:true}
    loadbalancer:
      cache:
        enabled: ${SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED:true}
        # Short TTL reduces how long a removed Query instance stays selectable.
        # Finite GET retries cover residual discovery propagation windows.
        ttl: ${SPRING_CLOUD_LOADBALANCER_CACHE_TTL:2s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${GATEWAY_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # metrics only for local HA/resilience acceptance via env override
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,gateway}
  endpoint:
    health:
      show-details: always
    gateway:
      access: read_only
  info:
    env:
      enabled: true

school-bus:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://school-bus.local}
      audience: ${JWT_AUDIENCE:school-bus-api}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  gateway:
    core-service-id: ${CORE_SERVICE_ID:school-bus-core}
    transport-query-service-id: ${TRANSPORT_QUERY_SERVICE_ID:school-bus-transport-query}
    iam-service-id: ${IAM_SERVICE_ID:school-bus-iam}
    payment-service-id: ${PAYMENT_SERVICE_ID:school-bus-payment}
    transport-command-service-id: ${TRANSPORT_COMMAND_SERVICE_ID:school-bus-transport-command}
    token-revocation:
      enabled: ${TOKEN_REVOCATION_ENABLED:true}
      fail-closed: ${TOKEN_REVOCATION_FAIL_CLOSED:true}
      key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:schoolbus:auth:revoked-before:}
    transport-query-resilience:
      # Override via SCHOOL_BUS_GATEWAY_TRANSPORT_QUERY_RESILIENCE_* env vars
      # or TRANSPORT_QUERY_RESILIENCE_ENABLED / TRANSPORT_QUERY_RESILIENCE_RETRIES.
      enabled: ${TRANSPORT_QUERY_RESILIENCE_ENABLED:true}
      retries: ${TRANSPORT_QUERY_RESILIENCE_RETRIES:1}
      connect-timeout: 500ms
      response-timeout: 2s
      first-backoff: 50ms
      max-backoff: 200ms

info:
  app:
    name: ${spring.application.name}
    role: api-gateway
  cloud:
    registry: nacos
