spring:
  cloud:
    nacos:
      config:
        enabled: false
        health-indicator:
          enabled: false
      discovery:
        enabled: false
        health-indicator:
          enabled: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  main:
    allow-bean-definition-overriding: true

school-bus:
  identity:
    worker-id: 3
  booking:
    payment-window: PT15M
    expiration:
      scheduler:
        enabled: false
  security:
    jwt:
      issuer: https://school-bus.local
      audience: school-bus-api
      access-token-ttl: PT15M
      public-key-location: classpath:does-not-matter-for-webmvctest.pem
  messaging:
    outbox-relay:
      enabled: false
      batch-size: 50
      claim-timeout: PT30S
      confirm-timeout: PT5S
      initial-retry-delay: PT5S
      maximum-retry-delay: PT5M
      maximum-attempts: 10
    payment:
      exchange: schoolbus.payment.events
      refund-routing-key: payment.refund.required
      refund-queue: schoolbus.payment.refund
      dead-letter-exchange: schoolbus.payment.dlx
      dead-letter-routing-key: payment.refund.dead
      dead-letter-queue: schoolbus.payment.refund.dlq
      succeeded-routing-key: payment.succeeded
      succeeded-queue: schoolbus.booking.payment-succeeded
      succeeded-dead-letter-routing-key: payment.succeeded.dead
      succeeded-dead-letter-queue: schoolbus.booking.payment-succeeded.dlq
    payment-succeeded-retry:
      exchange: schoolbus.booking.retry
      routing-key: payment.succeeded.retry
      queue: schoolbus.booking.payment-succeeded.retry
      delay: PT30S
      maximum-retries: 3
      confirm-timeout: PT5S
    booking-expiration:
      delay-exchange: schoolbus.booking.expiration.delay
      delay-routing-key: booking.payment.deadline.delay
      delay-queue: schoolbus.booking.expiration.delay
      processing-exchange: schoolbus.booking.events
      processing-routing-key: booking.payment.deadline.reached
      processing-queue: schoolbus.booking.expiration
      dead-letter-exchange: schoolbus.booking.dlx
      dead-letter-routing-key: booking.expiration.dead
      dead-letter-queue: schoolbus.booking.expiration.dlq
    trip-cancellation:
      exchange: schoolbus.transport.events
      requested-routing-key: trip.cancellation.requested
      requested-queue: schoolbus.booking.trip-cancellation
      dead-letter-exchange: schoolbus.transport.dlx
      dead-letter-routing-key: trip.cancellation.dead
      dead-letter-queue: schoolbus.transport.trip-cancellation.dlq
    trip-cancellation-retry:
      exchange: schoolbus.transport.cancellation.retry
      requested-routing-key: trip.cancellation.requested.retry
      requested-queue: schoolbus.booking.trip-cancellation.retry
      delay: PT30S
      maximum-retries: 3
      confirm-timeout: PT5S

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    db:
      enabled: false
