info:
  cloud:
    config-source: nacos

school-bus:
  payment:
    embedded:
      enabled: false
  iam:
    embedded:
      enabled: false
  trip-list-cache:
    ttl: PT1M
  security:
    jwt:
      # Cloud Core verifies tokens only; signing lives in school-bus-iam.
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
